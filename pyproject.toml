[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clip-agent"
version = "0.3.0"
description = "剪辑辅助 Agent：面向剪映 PC 创作者的 AI 剪辑辅助工具（自然语言 → Skill 编排 → 预览确认）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
# 语音转写可选后端（S006）：Apple Silicon + Python>=3.10 用 mlx-whisper，其余用 faster-whisper
asr-mlx = ["mlx-whisper"]
asr-faster = ["faster-whisper"]
asr = [
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.10'",
    "faster-whisper; sys_platform != 'darwin' or platform_machine != 'arm64' or python_version < '3.10'",
]

[project.scripts]
clip-agent = "clip_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["clip_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
